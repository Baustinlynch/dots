# Alacritty config
# Reference for all options: https://alacritty.org/config-alacritty.html

[general]
live_config_reload = true
# Machine overlay (laptop/desktop font size etc.)
# Symlink: ~/.config/alacritty/machine.toml → machines/<machine>.toml
import = ["~/.config/alacritty/machine.toml"]

[terminal]
shell = { program = "fish" }

[env]
TERM = "alacritty"

[window]
opacity = 0.95
padding = { x = 6, y = 6 }
decorations = "None"
dynamic_title = false

[scrolling]
history = 10000

[font]
normal = { family = "JetBrainsMono Nerd Font Mono", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font Mono", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font Mono", style = "Italic" }
# Size is machine-specific: see machines/<machine>.toml (imported via [general])

[cursor]
style = { shape = "Block", blinking = "On" }

[keyboard]
# Ctrl+Shift+Enter: new alacritty window in the same working directory
bindings = [
  { key = "Return", mods = "Control|Shift", action = "CreateNewWindow" },
]

[colors]
