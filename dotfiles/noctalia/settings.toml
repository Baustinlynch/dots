config_version = 16

[audio]
enable_overdrive = true

[backdrop]
enabled = true

[bar.default]
center = [ "clock", "date", "now-playing" ]
end = [ "tray", "notifications", "clipboard", "network", "bluetooth", "volume", "battery", "control-center", "session" ]
start = [ "launcher", "wallpaper", "workspaces", "widget", "btn" ]

[bluetooth]
connect_when_enabled = true
connection_notifications = true

[brightness]
enable_ddcutil = true
sync_all_monitors = true

[calendar]
enabled = true

[desktop_widgets]
schema_version = 2
widget_order = [ "desktop-widget-0000000000000004" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = false

    [desktop_widgets.widget.desktop-widget-0000000000000004]
    box_height = 130.1953125
    box_width = 572.833984375
    cx = 960.0
    cy = 668.31640625
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "audio_visualizer"

        [desktop_widgets.widget.desktop-widget-0000000000000004.settings]
        background = false
        bands = 32
        show_when_idle = false

[dock]
auto_hide = true
layer = "overlay"
position = "left"

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
address = "Edinburgh, Scotland, United Kingdom"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-login-box@winit" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@winit"]
    box_height = 196.0
    box_width = 810.0
    cx = 640.0
    cy = 618.0
    output = "winit"
    placement_height = 800.0
    placement_width = 1280.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@winit".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true

[osd.kinds]
media = false

[plugin_settings."notoxus/media-island"]
island_open_near_click = true
preview_seconds = 1
show_hours = true
title_limit = 40

[plugins]
enabled = [
    "turja-roy/todoist",
    "notfinaldev/spotify",
    "notoxus/media-island",
    "brendenaustin-lynch/zen-browser-screen-time",
    "prponkshe/mango-displays",
    "ezequiel/mango_layouts"
]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

[shell]
corner_radius_scale = 1.0500000156462193
font_family = "JetBrains Mono"
screen_time_enabled = true
settings_window_translucent = true
telemetry_enabled = true
time_format = "{:%H:%M:%S}"

    [shell.animation]
    speed = 1.3000000193715096

    [shell.greeter_sync]
    auto_sync = true

    [shell.panel]
    launcher_placement = "attached"
    polkit_placement = "attached"
    transparency_mode = "glass"

    [shell.screenshot]
    annotate = true
    copy_on_close = true
    directory = "/home/brendenaustin-lynch/Pictures/Screenshots"
    format = "webp"

[theme]
builtin = "Rosé Pine"
community_palette = "Solarized"
mode = "light"
source = "builtin"
wallpaper_scheme = "dysfunctional"

    [theme.templates]
    builtin_ids = [ "niri" ]
    community_ids = [ "zed" ]

[wallpaper]
directory = "/home/brendenaustin-lynch/Pictures/Background"
transition_on_startup = true

    [wallpaper.default]
    path = "/home/brendenaustin-lynch/Pictures/Background/October 2026.png"

    [wallpaper.last]
    path = "/home/brendenaustin-lynch/Pictures/Background/October 2026.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/brendenaustin-lynch/Pictures/Background/October 2026.png"

[widget.btn]
type = "ezequiel/mango_layouts:btn"

[widget.now-playing]
type = "notoxus/media-island:now-playing"

[widget.tray]
hidden = [ "Microsoft Teams", "Network", "slick", "onenote" ]

[widget.widget]
type = "turja-roy/todoist:widget"

[widget.workspaces]
style = "focus_hint"