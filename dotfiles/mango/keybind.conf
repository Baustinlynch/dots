# mango keybinds — migrated from niri (2026-11-12)
# Syntax: bind[flags]=MODIFIERS,KEY,COMMAND,PARAMETERS
# Flags: l=works when locked, s=keysym, r=release, p=pass, c=allow conflict
# Docs: https://mangowm.github.io/docs/bindings/keys
# Noctalia IPC binds per https://docs.noctalia.dev/noctalia/compositor-settings/mango/

# ─── Apps & Noctalia ───────────────────────────────────────────────────────
bind=SUPER,Return,spawn,alacritty
bind=SUPER,space,spawn,noctalia msg panel-toggle launcher
bind=SUPER+ALT,l,spawn,noctalia msg session lock
bind=SUPER,s,spawn,noctalia msg panel-toggle control-center
bind=SUPER+SHIFT,comma,spawn,noctalia msg settings-toggle
bind=ALT,Tab,spawn,noctalia msg window-switcher hold
bind=ALT+SHIFT,Tab,spawn,noctalia msg window-switcher hold reverse
bind=SUPER+SHIFT,s,spawn,noctalia msg screenshot-region --annotate
bind=SUPER,z,spawn,flatpak run dev.zed.Zed
bind=SUPER,b,spawn,zen-browser
bind=SUPER,o,spawn,flatpak run md.obsidian.Obsidian
bind=SUPER+ALT,s,spawn_shell,pkill orca || exec orca

# ─── Media / function keys (work while locked) ─────────────────────────────
bindl=NONE,XF86Calculator,spawn,alacritty -e qcalc
bindl=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up
bindl=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down
bindl=NONE,XF86AudioMute,spawn,noctalia msg volume-mute
bindl=NONE,XF86AudioMicMute,spawn,noctalia msg mic-mute
bindl=NONE,XF86AudioPlay,spawn,noctalia msg media toggle
bindl=NONE,XF86AudioStop,spawn,noctalia msg media stop
bindl=NONE,XF86AudioPrev,spawn,noctalia msg media previous
bindl=NONE,XF86AudioNext,spawn,noctalia msg media next

# Brightness keys are machine-specific (only the laptop has a backlight) —
# see machines/<machine>.conf

# ─── Screenshots (Noctalia) ────────────────────────────────────────────────
bind=NONE,Print,spawn,noctalia msg screenshot-region
bind=CTRL,Print,spawn,noctalia msg screenshot-fullscreen
bind=ALT,Print,spawn,noctalia msg screenshot-window

# ─── Windows ───────────────────────────────────────────────────────────────
bind=SUPER,q,killclient
bind=SUPER+SHIFT,o,toggleoverview

# Focus (niri: focus-column-left / focus-window-down etc.)
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right

# Move (niri: move-column-left / move-window-down etc.)
bind=SUPER+CTRL,Left,move_client,left
bind=SUPER+CTRL,Down,move_client,down
bind=SUPER+CTRL,Up,move_client,up
bind=SUPER+CTRL,Right,move_client,right
bind=SUPER+CTRL,h,move_client,left
bind=SUPER+CTRL,j,move_client,down
bind=SUPER+CTRL,k,move_client,up
bind=SUPER+CTRL,l,move_client,right

# Monitors (niri: focus-monitor-left / move-column-to-monitor-left)
bind=SUPER+SHIFT,Left,focusmon,left
bind=SUPER+SHIFT,Down,focusmon,down
bind=SUPER+SHIFT,Up,focusmon,up
bind=SUPER+SHIFT,Right,focusmon,right
bind=SUPER+SHIFT,h,focusmon,left
bind=SUPER+SHIFT,j,focusmon,down
bind=SUPER+SHIFT,k,focusmon,up
bind=SUPER+SHIFT,l,focusmon,right
bind=SUPER+SHIFT+CTRL,Left,tagmon,left
bind=SUPER+SHIFT+CTRL,Down,tagmon,down
bind=SUPER+SHIFT+CTRL,Up,tagmon,up
bind=SUPER+SHIFT+CTRL,Right,tagmon,right
bind=SUPER+SHIFT+CTRL,h,tagmon,left
bind=SUPER+SHIFT+CTRL,j,tagmon,down
bind=SUPER+SHIFT+CTRL,k,tagmon,up
bind=SUPER+SHIFT+CTRL,l,tagmon,right

# ─── Tags (niri workspaces) ────────────────────────────────────────────────
# niri Page_Down/U (focus-workspace-down) → next tag; Page_Up/I → previous tag
bind=SUPER,Page_Down,viewtoright
bind=SUPER,Page_Up,viewtoleft
bind=SUPER,u,viewtoright
bind=SUPER,i,viewtoleft
bind=SUPER+CTRL,Page_Down,tagtoright
bind=SUPER+CTRL,Page_Up,tagtoleft
bind=SUPER+CTRL,u,tagtoright
bind=SUPER+CTRL,i,tagtoleft
# niri: focus-workspace 1..9 / move-column-to-workspace 1..9
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9
bind=SUPER+CTRL,1,tag,1
bind=SUPER+CTRL,2,tag,2
bind=SUPER+CTRL,3,tag,3
bind=SUPER+CTRL,4,tag,4
bind=SUPER+CTRL,5,tag,5
bind=SUPER+CTRL,6,tag,6
bind=SUPER+CTRL,7,tag,7
bind=SUPER+CTRL,8,tag,8
bind=SUPER+CTRL,9,tag,9
# niri move-workspace-down/up has no tag equivalent (tags are fixed slots)

# ─── Layout / sizing ───────────────────────────────────────────────────────
# niri: switch-preset-column-width (Mod+R). Mod+Shift+R reverse has no
# equivalent; the preset cycle is one-directional.
bind=SUPER,r,switch_proportion_preset
# niri: set-column-width -10%/+10% (master/stack factor in tile layouts)
bind=SUPER,minus,setmfact,-0.05
bind=SUPER,equal,setmfact,+0.05
# niri: maximize-column / fullscreen-window / maximize-window-to-edges
bind=SUPER,f,togglemaximizescreen
bind=SUPER+SHIFT,f,togglefullscreen
bind=SUPER,m,togglefakefullscreen
# niri: center-column (mango centers floating windows)
bind=SUPER,c,centerwin
# niri: toggle-column-tabbed-display (cycles tile/scroller/monocle/deck)
bind=SUPER,w,switch_layout
# niri: consume-or-expel-window-left/right → mango window groups
# Bound by keycode: the gb layout inherits latin's AltGr symbols, so keysym
# "bracketleft" also exists on the 8 key (AltGr+8) and resolves there first,
# conflicting with the SUPER,8 tag bind above.
bind=SUPER,code:34,groupjoin,left
bind=SUPER,code:35,groupjoin,right
# niri: consume-window-into-column / expel-window-from-column
bind=SUPER,comma,groupjoin,down
bind=SUPER,period,groupjoin,right

# ─── Floating ──────────────────────────────────────────────────────────────
# niri: toggle-window-floating
bind=SUPER,v,togglefloating
# niri: switch-focus-between-floating-and-tiling has no direct equivalent

# ─── Trackpad scroll (niri parity) ─────────────────────────────────────────
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client
axisbind=SUPER+CTRL,UP,tagtoleft
axisbind=SUPER+CTRL,DOWN,tagtoright
axisbind=SUPER,LEFT,focusdir,left
axisbind=SUPER,RIGHT,focusdir,right
axisbind=SUPER+CTRL,LEFT,move_client,left
axisbind=SUPER+CTRL,RIGHT,move_client,right

# ─── Misc ──────────────────────────────────────────────────────────────────
# Edit the mango config in Zed (hot-reload applies changes on save)
bind=SUPER+SHIFT,c,spawn,flatpak run dev.zed.Zed ~/.config/mango/config.conf
# niri: type an em-dash into the focused window (requires wtype)
bind=CTRL+ALT,minus,spawn,wtype —
# niri: quit (confirmation dialogs are niri-only, so take care)
bind=SUPER+SHIFT,e,quit
bind=CTRL+ALT,Delete,quit
# niri hotkey overlay (Mod+Shift+/) is a niri feature; this file is the
# reference instead. Mod+Escape shortcuts-inhibit toggle has no dispatcher;
# allow_shortcuts_inhibit is managed per-window in config.conf.
# niri power-off-monitors (Mod+Shift+P): use `mmsg dispatch sleep_toggle_monitor,<name>`
