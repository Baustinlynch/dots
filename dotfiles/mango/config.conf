# mango compositor config — migrated from niri (2026-11-12)
# Docs: https://mangowm.github.io/docs/
# Validate with: mango -c ~/.config/mango/config.conf -p

# ─── Layout ────────────────────────────────────────────────────────────────
# Default layout is set per machine in machines/<machine>.conf (laptop runs
# the scroller everywhere; desktop scrolls on the ultrawide, tiles the 1440p).

# niri layout.gaps 8 (from basicsettings.kdl)
gap_inner_horizontal=8
gap_inner_vertical=8
gap_outer_horizontal=8
gap_outer_vertical=8

# niri default-column-width proportion 0.5 and
# preset-column-widths 1/3, 1/2, 2/3 (Mod+R cycles these)
scroller_default_proportion=0.5
scroller_proportion_preset=0.33333,0.5,0.66667

# ─── Visuals ───────────────────────────────────────────────────────────────
# niri had focus-ring off / border off; disable mango borders to match.
border_px=0
# Colors kept for when borders are re-enabled (Rose Pine, from noctalia.kdl)
focus_color=0xd7827eff
border_color=0x505050ff
urgent_color=0xb4637aff

# niri window-rule geometry-corner-radius 8
border_radius=8

# niri layout.shadow on (softness 30, spread 5, offset y=5, color #0007)
shadows=1
shadow_only_floating=0
shadows_size=5
shadows_blur=30
shadows_position_x=0
shadows_position_y=5
shadows_color=0x00000070
# Noctalia draws its own surfaces with shadows/blur baked in; layer shadows
# would double up, so keep them off (Noctalia guide: compositor layer effects
# must stay off). Window shadows/blur above are fine.
layer_shadows=0

# niri blur: 2 passes, noise 0.03, saturation 1.0
blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes=2
blur_params_radius=5
blur_params_noise=0.03
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.0

# Noctalia animates its own surfaces; compositor layer animations cause
# glitches (Noctalia guide). Required even if other effects stay off.
layer_animations=0

# Layout cycle for Mod+W (niri toggled tabbed-column display)
circle_layout=tile,scroller,monocle,deck

# niri workspaces are a vertical strip; make tag switches slide vertically
tag_animation_direction=0

# ─── Input ─────────────────────────────────────────────────────────────────
numlock_on=1
# UK English keyboard (XKB layout "gb"); localectl is also set to gb
xkb_rules_layout=gb
# Trackpad settings are machine-specific — see machines/<machine>.conf
trackpad_scroll_factor=0.5

# ─── Focus & behavior ──────────────────────────────────────────────────────
focus_on_activate=1
sloppy_focus=1
warp_cursor=1

# ─── Window rules ──────────────────────────────────────────────────────────
# Obsidian semi-transparent (niri opacity 0.90)
window_rule=focused_opacity:0.90,unfocused_opacity:0.90,app_id:obsidian
# Firefox picture-in-picture opens floating
window_rule=is_floating:1,app_id:firefox,title:^Picture-in-Picture$
# Noctalia settings GUI as a floating window (niri rule: 1080x920)
window_rule=is_floating:1,width:1080,height:920,app_id:dev.noctalia.Noctalia

# ─── Autostart ─────────────────────────────────────────────────────────────
# Desktop shell: bar, launcher, notifications, wallpaper, lock screen,
# control center, screenshots (replaces waybar/waypaper/mako/fuzzel/swaylock).
exec_once=noctalia
# Note: no xwayland-satellite needed — mango supports XWayland natively,
# and there is no DISPLAY=:0 environment override either.

# ─── Keybinds ──────────────────────────────────────────────────────────────
source=~/.config/mango/keybind.conf
source=~/.config/mango/machine.conf
