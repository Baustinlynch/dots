# Laptop machine overlay (this machine: Dell Inspiron 3525, single eDP-1)
# Selected via the ~/.config/mango/machine.conf symlink; sourced by config.conf.

# ─── Trackpad (laptop only) ────────────────────────────────────────────────
tap_to_click=1
trackpad_natural_scrolling=1
# niri did not enable disable-while-typing
trackpad_disable_while_typing=0

# ─── Layout ────────────────────────────────────────────────────────────────
# niri is a scrollable-tiling compositor; scroller is the closest match and is
# the default layout on every tag on the laptop.
tag_rule=id:*,layout_name:scroller

# ─── Keybinds ──────────────────────────────────────────────────────────────
# Brightness keys: this machine has a backlight (desktop has none)
bindl=NONE,XF86MonBrightnessUp,spawn,noctalia msg brightness-up
bindl=NONE,XF86MonBrightnessDown,spawn,noctalia msg brightness-down
