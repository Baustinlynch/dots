# Desktop machine overlay
# Selected via the ~/.config/mango/machine.conf symlink; sourced by config.conf.
#
# Setup on the desktop:
#   ln -s ~/dots/dotfiles/mango/machines/desktop.conf ~/.config/mango/machine.conf
#   mmsg get all-monitors        # find the real output names, then edit below

# ─── Layout: ultrawide (main) scroller, 1440p tiling ───────────────────────
# TODO: replace the monitor_name values with the real names from
# `mmsg get all-monitors` on the desktop (e.g. DP-1 / HDMI-A-1).
tag_rule=id:*,monitor_name:<ULTRAWIDE-MAIN>,layout_name:scroller
tag_rule=id:*,monitor_name:<1440P-SECONDARY>,layout_name:tile

# Scroller proportions tuned for the ultrawide: niri-mirroring presets
# (shared base already sets scroller_default_proportion=0.5)

# ─── Notes ─────────────────────────────────────────────────────────────────
# - No trackpad settings: desktop has no trackpad (globals are harmless).
# - No brightness keybinds: no backlight. If the desktop monitor supports
#   DDC/CI, install `ddcutil` and add binds like:
#     bindl=NONE,XF86MonBrightnessUp,spawn,ddcutil set-brightness +10
# - Add monitor scale/position overrides here if needed, e.g.
#     monitor=... (see https://mangowm.github.io/docs/configuration/monitors)
